<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Load test</title>
</head>
<body>
<h1>Load test</h1>
<p id="result">not run</p>
<div id="list"></div>
<script>
// One round loads the browser in three ways: computing in several threads
// (Web Worker), building the page (DOM and layout) and allocating memory.
// The number of rounds tells how much work the run got done.
// Several threads make the run want more processor than its CPU limit allows.

const workerCode = `
  onmessage = (message) => {
    const limit = message.data;
    let primes = 0;
    for (let i = 2; i < limit; i++) {
      let prime = true;
      for (let j = 2; j * j <= i; j++) {
        if (i % j === 0) { prime = false; break; }
      }
      if (prime) primes++;
    }
    postMessage(primes);
  };`;
const workers = [];

function compute(worker, limit) {
  return new Promise((resolve, reject) => {
    worker.onmessage = (message) => resolve(message.data);
    worker.onerror = (e) => reject(new Error('worker thread: ' + e.message));
    worker.postMessage(limit);
  });
}

async function round(limit, threads) {
  // 1. Computing: every thread counts the primes up to the limit.
  while (workers.length < threads) {
    const url = URL.createObjectURL(new Blob([workerCode], { type: 'text/javascript' }));
    workers.push(new Worker(url));
  }
  const results = await Promise.all(workers.slice(0, threads).map((w) => compute(w, limit)));
  const primes = results.every((n) => n === results[0]) ? results[0] : -1;

  // 2. Building the page: 3000 rows, layout and removal.
  const list = document.getElementById('list');
  const fragment = document.createDocumentFragment();
  for (let i = 0; i < 3000; i++) {
    const row = document.createElement('div');
    row.textContent = 'row ' + i;
    row.style.width = (50 + i % 300) + 'px';
    fragment.appendChild(row);
  }
  list.appendChild(fragment);
  const height = list.offsetHeight;   // forces layout
  list.textContent = '';

  // 3. Memory: about 40 MB for a moment.
  const buffer = new Float64Array(5000000).fill(primes);

  document.getElementById('result').textContent =
    'primes ' + primes + ', threads ' + threads + ', height ' + height +
    ' px, buffer ' + buffer.length;
  return primes;
}
</script>
</body>
</html>
